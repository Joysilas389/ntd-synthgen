<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download · NTD SynthGen</title>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body>

<main class="container py-5">
  <span class="eyebrow">Export</span>
  <h1 class="mt-3">Download synthetic dataset.</h1>
  <p class="lede">The synthetic CSV is generated on the server and streamed to your
  browser. No real records are embedded — only the learnt joint distribution.</p>

  <div class="card-paper mt-4">
    <h3>Current generated dataset</h3>
    <div id="download-info"></div>
  </div>

  <div class="card-paper mt-4">
    <h3>Download by ID</h3>
    <p style="font-family: var(--f-sans); font-size: 0.9rem; color: var(--c-ink-soft);">Have an ID from a previous session? Paste it here.</p>
    <form id="manual-form" class="d-flex gap-2 align-items-end flex-wrap">
      <div style="flex: 1; min-width: 240px;">
        <label class="form-label">Dataset ID</label>
        <input id="manual-id" class="form-control" placeholder="gen_xxxxxxxxxx">
      </div>
      <button class="btn btn-accent" type="submit">Download</button>
    </form>
  </div>
</main>

<script src="../js/api.js"></script>
<script src="../js/layout.js"></script>
<script>
  NTDLayout.renderHeader("download");
  NTDLayout.renderFooter();

  const id = NTD.Session.get("dataset_generated");
  const info = document.getElementById("download-info");
  if (id) {
    info.innerHTML = `
      <p>Last generated: <code>${id}</code></p>
      <a href="${NTD.API.downloadUrl(id)}" class="btn btn-accent">Download CSV</a>`;
  } else {
    info.innerHTML = `<div class="alert alert-warning">No generated dataset in this session yet. <a href="generate.html">Generate one.</a></div>`;
  }

  document.getElementById("manual-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const v = document.getElementById("manual-id").value.trim();
    if (v) window.location.href = NTD.API.downloadUrl(v);
  });
</script>
</body>
</html>
